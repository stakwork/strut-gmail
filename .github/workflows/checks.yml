name: checks

# Every PR and every push to main: the package installed from this checkout
# into a strut started from stakwork/strut's main, on a LadybugDB file, and
# driven as the Gmail app's page and a person's own workflow drive it
# (package.test.ts). Strut is installed as its own CI installs it
# (stakwork/strut .github/workflows/tests.yml): yarn.lock, no scripts, and
# the kit's own install. Gmail is a fake HTTP server inside the test: nothing
# reaches Google and no token is read.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: gmail

      - uses: actions/checkout@v4
        with:
          repository: stakwork/strut
          ref: main
          path: strut

      # The Node strut asks for: its own .nvmrc, read from its checkout, so a
      # bump in strut moves this check with it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: strut/.nvmrc
          cache: yarn
          cache-dependency-path: |
            strut/yarn.lock
            strut/kit/yarn.lock

      - name: Install strut
        working-directory: strut
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn --cwd kit install --frozen-lockfile --ignore-scripts
          echo "strut $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test the package on strut
        working-directory: gmail
        env:
          STRUT_DIR: ${{ github.workspace }}/strut
        run: npm test
