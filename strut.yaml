package: stadeum/gmail
version: 0.1.0
description: Read, search, draft and send your Gmail from workflows.
requires:
  # Each person's own token. Connect Google (stadeum's connect seam) writes
  # it; Disconnect revokes it at Google and deletes it. The steps read only
  # the person's own value (`secrets.own`), never a deployment's: a mailbox
  # is whoever's token the run has, and there is none for the box.
  optional: [GOOGLE_TOKEN, STRUT_DEFAULT_MODEL]
  # STRUT_DEFAULT_MODEL is the box's default model (stadeum's Models page,
  # "Org default"), not a credential: Replies writes on it, and `context`
  # reads its name to fail plainly when a box has none, rather than let
  # strut's `agent` fall to a model nobody chose.
provides:
  secrets: [GOOGLE_TOKEN]
# `reply` every five minutes, once for each person who holds their own
# GOOGLE_TOKEN, as that person: their token, their bill, and their own
# `last`, so each run starts where that person's last one stopped. Nobody
# else's run, and none for the deployment's value, which is nobody's. An
# admin turns it on or off for everyone at once. Each run's log goes after
# a day (`retain: 1d` in workflows/reply.yaml, ruling 12).
schedules:
  - workflow: reply
    trigger: { every: interval, minutes: 5 }
    input: { since: "{{ last.output.since }}" }
    each: GOOGLE_TOKEN
  # `ask` the same way. Email Jamie is off until a person turns it on in
  # the Gmail app, and a run for a person with it off is three steps and no
  # call to Gmail.
  - workflow: ask
    trigger: { every: interval, minutes: 5 }
    input: { since: "{{ last.output.since }}" }
    each: GOOGLE_TOKEN
# The most one run of `reply` may spend on the model, in dollars: every
# message it answers, its `reply-one` runs included. An admin's own cap
# wins over it. `ask` has none: its run makes no model call, and the job it
# starts runs as strut's own `job` workflow, in runs of its own.
maxRunCostUsd:
  reply: 1
job:
  # The job agent's mail tools, as the job's person (plans/gmail.md §4.5):
  # "tell Bob Tuesday works" is a job. A send asks first: it is a proposal
  # the person accepts, with whom it goes to and the text on its card.
  # The `Email` page under `Job` says how to use them.
  tools: [search, read, draft, send]
  approve: [send]
