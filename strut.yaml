package: stadeum/gmail
version: 0.1.0
description: Read, search, draft and send your Gmail from workflows.
requires:
  # Each person's own token. Connect Google (stadeum's connect seam) writes
  # it; Disconnect revokes it at Google and deletes it. The steps read only
  # the person's own value (`secrets.own`), never a deployment's: a mailbox
  # is whoever's token the run has, and there is none for the box.
  optional: [GOOGLE_TOKEN]
provides:
  secrets: [GOOGLE_TOKEN]
# `reply` every five minutes, once for each person who holds their own
# GOOGLE_TOKEN, as that person: their token, their bill, and their own
# `last`, so each run starts where that person's last one stopped. Nobody
# else's run, and none for the deployment's value, which is nobody's. An
# admin turns it on or off for everyone at once. Each run's log goes after
# a day (`retain: 1d` in workflows/reply.yaml, ruling 12).
schedules:
  - workflow: reply
    trigger: { every: interval, minutes: 5 }
    input: { since: "{{ last.output.since }}" }
    each: GOOGLE_TOKEN
# The most one run of `reply` may spend on the model, in dollars: every
# message it answers, its `reply-one` runs included. An admin's own cap
# wins over it.
maxRunCostUsd:
  reply: 1
